<!DOCTYPE html>
<html>
  <head>
    <title>YASH GOYAL</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxj2yyDdXBrxR0omB8uv5QNsFJA4TjHjSxwQ&s" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe src="yashgoyalcv.pdf"></iframe>

    <!-- Visit tracking: pings a Google Apps Script which logs one row per visit -->
    <script>
      (async function () {
        // 1) Paste your deployed Apps Script web-app URL here (see TRACKING_SETUP.md)
        var ENDPOINT = "https://script.google.com/macros/s/AKfycbyCRWzid2eNP1jDLUkGavZc-PnUqZYLfV6MDZxTXOy0Q7FkW413hkQ8D9HjZVJfC3jf/exec";
        if (ENDPOINT.indexOf("REPLACE_WITH") === 0) return;
        try {
          // Keyless IP-geo lookup with a fallback (services rate-limit / block).
          var geo = {};
          try {
            var r = await fetch("https://get.geojs.io/v1/ip/geo.json");
            geo = await r.json();
          } catch (e) {
            try {
              var r2 = await fetch("https://ipapi.co/json/");
              geo = await r2.json();
            } catch (e2) {}
          }
          // Per-recipient link code. You hand out a distinct link to each
          // person, e.g. cv.yashgoyal.sbs/?v=7f3a, and the visit row tells you
          // which link was opened. Reads as a cache-busting version param.
          var qs = new URLSearchParams(location.search);
          var tag = qs.get("v") || qs.get("utm_campaign") || qs.get("utm_source") || "";
          var remembered = false;
          try {
            if (tag) {
              localStorage.setItem("rv", tag);
            } else {
              tag = localStorage.getItem("rv") || "";
              remembered = !!tag; // same browser returning without the param
            }
          } catch (e) {}

          var data = {
            time: new Date().toISOString(),
            page: location.href,
            tag: tag,
            tagRemembered: remembered,
            utmSource: qs.get("utm_source") || "",
            utmMedium: qs.get("utm_medium") || "",
            utmCampaign: qs.get("utm_campaign") || "",
            referrer: document.referrer || "(direct)",
            userAgent: navigator.userAgent,
            language: navigator.language || "",
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
            screen: screen.width + "x" + screen.height,
            ip: geo.ip || "",
            city: geo.city || "",
            region: geo.region || geo.region_code || "",
            country: geo.country || geo.country_name || "",
            isp: geo.organization_name || geo.org || geo.organization || ""
          };
          fetch(ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data)
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
